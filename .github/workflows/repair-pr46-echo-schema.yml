name: Reconcile PR46 Echo schema expectation

on:
  push:
    branches:
      - docs/2026-10-01-state-editorial-sprint

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/2026-10-01-state-editorial-sprint
      - name: Reconcile Echo checker with migration 0006
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/echo-persistence.mjs')
          s=p.read_text()
          old='const MIGRATIONS = ["0001_editorial_foundation.sql", "0002_admin_queue.sql", "0003_live_analysis.sql", "0004_watchdesk_runs.sql", "0005_echo_durable_contracts.sql"];'
          new='const MIGRATIONS = ["0001_editorial_foundation.sql", "0002_admin_queue.sql", "0003_live_analysis.sql", "0004_watchdesk_runs.sql", "0005_echo_durable_contracts.sql", "0006_watchdesk_source_learning.sql"];'
          if old not in s:
              raise SystemExit('Expected MIGRATIONS declaration not found')
          s=s.replace(old,new)
          s=s.replace('assert.equal(version[0]?.value, "5");','assert.equal(version[0]?.value, "6");')
          s=s.replace('Echo persistence schema valid in isolated local D1: v5,','Echo persistence schema valid in isolated local D1: v6,')
          s=s.replace('actual five migrations locally','actual six migrations locally')
          p.write_text(s)
          PY
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/echo-persistence.mjs
          git commit -m "Reconcile Echo checker with schema v6"
          git push origin HEAD:docs/2026-10-01-state-editorial-sprint
