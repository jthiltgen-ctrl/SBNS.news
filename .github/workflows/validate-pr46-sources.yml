name: Validate PR46 source portfolio

on:
  push:
    branches:
      - docs/2026-10-01-state-editorial-sprint

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run watchdesk:check
      - run: npm run watchdesk:test
      - run: node scripts/watchdesk.mjs probe
