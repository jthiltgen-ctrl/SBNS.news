name: Validate PR46 downstream integration

on:
  push:
    branches:
      - docs/2026-10-01-state-editorial-sprint

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All code/test suites through Story Queue passed on run 36911091184.
      # This final bounded rerun checks only the three steps skipped after its
      # workflow-local Wrangler invocation error.
      - run: npx wrangler deploy --config wrangler.admin.jsonc --dry-run
      - run: php -l integrations/storyqueue/greengeeks-pipe.php
      - run: node scripts/watchdesk.mjs probe
