name: Deploy public staging Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - content/**
      - package-lock.json
      - package.json
      - public/**
      - scripts/content.mjs
      - src/index.js
      - wrangler.jsonc

permissions:
  contents: read

concurrency:
  group: public-staging-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy sbns-news
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public application
        run: |
          npm run content:check
          node --check public/app.js
          node --check src/index.js
          npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Deploy public staging Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify staging health
        shell: bash
        run: |
          health="$(curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 3 \
            https://sbns-news.sbns-news.workers.dev/api/health)"
          node -e '
            const health = JSON.parse(process.argv[1]);
            if (health.ok !== true || health.version !== "v1.5 phase 3 staging") {
              console.error("Unexpected staging health response", health);
              process.exit(1);
            }
            console.log(`Verified ${health.name} ${health.version}`);
          ' "$health"
