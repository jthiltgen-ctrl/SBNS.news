name: Deploy public Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - assets/brand/**
      - assets/fonts/**
      - content/**
      - package-lock.json
      - package.json
      - public/**
      - scripts/content.mjs
      - scripts/share-card.mjs
      - src/index.js
      - wrangler.jsonc

permissions:
  contents: read

concurrency:
  group: public-staging-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy sbns-news
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public application
        run: |
          npm run content:check
          npm run public:test
          node --check public/app.js
          node --check public/story.js
          node --check scripts/share-card.mjs
          node --check scripts/public.mjs
          node --check src/index.js
          npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Deploy public Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify public health
        shell: bash
        run: |
          for attempt in {1..10}; do
            if health="$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "https://sbns-news.sbns-news.workers.dev/api/health?run=${GITHUB_RUN_ID}&attempt=${attempt}")" &&
              node -e '
                const health = JSON.parse(process.argv[1]);
                if (health.ok !== true || health.version !== "v1.5 production") {
                  process.exit(1);
                }
                console.log(`Verified ${health.name} ${health.version}`);
              ' "$health"; then
                exit 0
            fi
            echo "Waiting for public Worker propagation (${attempt}/10)."
            sleep 3
          done
          echo "Public health did not reach the expected version."
          exit 1
