name: Validate PR46 final integration

on:
  push:
    branches:
      - docs/2026-10-01-state-editorial-sprint

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: php -l integrations/storyqueue/greengeeks-pipe.php
      - run: node scripts/watchdesk.mjs probe
