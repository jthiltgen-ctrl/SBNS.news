name: Regenerate PR46 intake bundle

on:
  push:
    branches:
      - docs/2026-10-01-state-editorial-sprint

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/2026-10-01-state-editorial-sprint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run intake:build
      - name: Commit deterministic bundle if changed
        run: |
          if git diff --quiet -- public/admin/intake-fixtures.json; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin/intake-fixtures.json
          git commit -m "Regenerate intake fixture bundle"
          git push origin HEAD:docs/2026-10-01-state-editorial-sprint
