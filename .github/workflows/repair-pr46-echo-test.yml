name: Reconcile PR46 Echo test schema expectation

on:
  push:
    branches:
      - docs/2026-10-01-state-editorial-sprint

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/2026-10-01-state-editorial-sprint
      - name: Reconcile remaining Echo v5 test assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/echo-persistence.mjs')
          s=p.read_text()
          old='assert.equal(version[0]?.value, "5");'
          if old not in s:
              raise SystemExit('No remaining v5 Echo assertion found')
          s=s.replace(old,'assert.equal(version[0]?.value, "6");')
          p.write_text(s)
          PY
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/echo-persistence.mjs
          git commit -m "Reconcile Echo test with schema v6"
          git push origin HEAD:docs/2026-10-01-state-editorial-sprint
